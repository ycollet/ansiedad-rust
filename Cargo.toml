[package]
name = "ansiedad"
version = "0.1.0"
edition = "2024"
description = "Live-coded ANSI bytebeat visuals in your terminal"
license = "AGPL-3.0-only"
default-run = "ansiedad"

[features]
gui = ["dep:eframe", "dep:fontdue", "dep:tempfile"]

[[bin]]
name = "ansiedad-gui"
path = "src/bin/ansiedad-gui.rs"
required-features = ["gui"]

[dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
crossterm = "0.29"
eframe = { version = "0.37", optional = true, default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
fontdue = { version = "0.9", optional = true }
tempfile = { version = "3", optional = true }
unicode-width = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
